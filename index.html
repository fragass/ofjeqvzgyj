<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9969980794780268" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workday CNX</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="css/loginf.css">
</head>
<body>
  <div id="principalParent">
    <div id="backgroundDoCliente" class="centro" aria-hidden="true"></div>

    <aside id="principal">
      <div class="sessao idioma-topo">
        <button type="button" class="sa3-idioma-conteudo" aria-label="Idioma atual: Português">
          <img id="flag-icon-css-br" src="https://flagcdn.com/w40/br.png" alt="Português">
          <span class="sa3-idioma-descricao">Português</span>
          <span class="sa3-idioma-icone"></span>
        </button>
      </div>

      <div id="pnlPrincipal" class="center-panel">
        <div id="cabecalho">
          <div id="logotipo" class="logotipo__imagem" aria-label="Concentrix"></div>
        </div>

        <div id="conteudo">
          <form id="loginForm" novalidate>
            <div id="mensagens">
              <p id="errorMsg" class="msgAlerta msgAlerta-erro" hidden></p>
            </div>

            <div class="sessao">
              <input type="text" id="username" name="username" placeholder="Login" autocomplete="username" required>
            </div>

            <div class="sessao senha-sessao">
              <div class="hideShowPassword-wrapper">
                <input type="password" id="password" name="password" placeholder="Senha" autocomplete="current-password" required>
                <button type="button" id="togglePassword" class="hideShowPassword-toggle" aria-label="Mostrar senha">Mostrar senha</button>
              </div>
            </div>

            <div class="sessao acoes-login">
              <button type="submit" class="botao botaoConfirmar" id="submitBtn">Entrar</button>
              <a href="#" class="esqueci primeiro-acesso">Primeiro Acesso?</a>
              <a href="#" class="esqueci">Esqueceu sua senha?</a>
            </div>
          </form>
        </div>
      </div>
    </aside>
  </div>

  <script src="js/loginf.js"></script>
</body>
</html>

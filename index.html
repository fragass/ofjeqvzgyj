<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9969980794780268" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workday CNX</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="css/loginf.css">
</head>
<body>
  <main class="login-layout">
    <section class="login-visual" aria-hidden="true"></section>

    <section class="login-side">
      <div class="language-box" aria-label="Idioma atual">
        <div class="sa3-idioma-conteudo">
          <span class="flag-icon">🇧🇷</span>
          <span class="sa3-idioma-descricao">Português</span>
          <span class="sa3-idioma-icone"></span>
        </div>
      </div>

      <div class="login-content">
        <img src="85Logo.png" alt="Concentrix" class="brand-logo">

        <form id="loginForm" novalidate>
          <input type="text" id="username" placeholder="Login" autocomplete="username" required>

          <div class="password-field">
            <input type="password" id="password" placeholder="Senha" autocomplete="current-password" required>
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5C6 5 2.1 10 1 12c1.1 2 5 7 11 7s9.9-5 11-7c-1.1-2-5-7-11-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"></path>
                <circle cx="12" cy="12" r="2.4"></circle>
              </svg>
            </button>
          </div>

          <div class="login-actions">
            <button type="submit" class="submit-btn">Entrar</button>

            <div class="support-links">
              <a href="#" tabindex="-1">Primeiro Acesso?</a>
              <span class="divider">|</span>
              <a href="#" tabindex="-1">Esqueceu sua senha?</a>
            </div>
          </div>
        </form>

        <p id="errorMsg" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script src="js/loginf.js"></script>
</body>
</html>

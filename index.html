<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9969980794780268" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workday CNX</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="css/loginf.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-hero" aria-hidden="true"></section>

    <section class="login-panel">
      <div class="panel-inner">
        <button class="language-switch" type="button" aria-label="Idioma atual: Português">
          <span class="flag-br" aria-hidden="true"></span>
          <span class="language-text">Português</span>
          <span class="language-caret" aria-hidden="true"></span>
        </button>

        <img src="85Logo.png" alt="Concentrix" class="brand-logo">

        <form id="loginForm" novalidate>
          <div class="field-group">
            <input type="text" id="username" placeholder="Login" autocomplete="off" required>
          </div>

          <div class="field-group password-group">
            <input type="password" id="password" placeholder="Senha" autocomplete="off" required>
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5c5.23 0 9.27 3.11 11 7-1.73 3.89-5.77 7-11 7S2.73 15.89 1 12c1.73-3.89 5.77-7 11-7Zm0 2C8.18 7 5.13 9.12 3.49 12 5.13 14.88 8.18 17 12 17s6.87-2.12 8.51-5C18.87 9.12 15.82 7 12 7Zm0 2.2a2.8 2.8 0 1 1 0 5.6 2.8 2.8 0 0 1 0-5.6Z"/>
              </svg>
            </button>
          </div>

          <div class="actions-row">
            <button type="submit" class="submit-btn" id="submitBtn">Entrar</button>
            <div class="helper-links">
              <a href="#">Primeiro Acesso?</a>
              <a href="#">Esqueceu sua senha?</a>
            </div>
          </div>

          <p id="errorMsg" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="js/loginf.js"></script>
</body>
</html>

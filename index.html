<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9969980794780268"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workday CNX</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="css/loginf.css">
</head>
<body>
  <main class="login-layout">
    <section class="login-visual" aria-hidden="true"></section>

    <section class="login-panel">
      <div class="panel-inner">
        <div class="language-switcher" role="button" tabindex="0" aria-label="Selecionar idioma">
          <span class="flag-circle">🇧🇷</span>
          <span class="language-text">Português</span>
          <span class="language-arrow">▼</span>
        </div>

        <img class="brand-logo" src="85Logo.png" alt="Concentrix">

        <form id="loginForm" novalidate>
          <div class="field-group">
            <input type="text" id="username" placeholder="Login" autocomplete="username" required>
          </div>

          <div class="field-group password-group">
            <input type="password" id="password" placeholder="Senha" autocomplete="current-password" required>
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Mostrar senha" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5C6.5 5 2.1 8.4.5 12c1.6 3.6 6 7 11.5 7s9.9-3.4 11.5-7C21.9 8.4 17.5 5 12 5Zm0 11.2A4.2 4.2 0 1 1 12 7.8a4.2 4.2 0 0 1 0 8.4Zm0-6.8A2.6 2.6 0 1 0 12 14.6 2.6 2.6 0 0 0 12 9.4Z"/>
              </svg>
            </button>
          </div>

          <div class="actions-row">
            <button type="submit" class="login-submit">Entrar</button>
            <div class="helper-links">
              <a href="#" tabindex="-1">Primeiro Acesso?</a>
              <a href="#" tabindex="-1">Esqueceu sua senha?</a>
            </div>
          </div>

          <p id="errorMsg" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="js/loginf.js"></script>
</body>
</html>
